<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gorilla AI System</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --primary: #38bdf8; --accent: #22c55e; --text: #f8fafc; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; align-items: center; justify-content: center; }
        .container { background: var(--card); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); padding: 40px; max-width: 600px; width: 90%; text-align: center; }
        h1 { color: var(--primary); font-size: 2.5rem; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 1.1rem; margin-bottom: 30px; }
        .btn { display: inline-block; padding: 12px 28px; background: var(--accent); color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; transition: transform 0.2s; }
        .btn:hover { transform: scale(1.05); }
        /* Estilos del Agente IA Integrado */
        .agent-box { margin-top: 30px; border-top: 1px solid #334155; padding-top: 20px; text-align: left; }
        .agent-box h3 { font-size: 1.2rem; color: var(--primary); margin-bottom: 10px; }
        .chat-output { background: #0f172a; border-radius: 8px; padding: 15px; height: 120px; overflow-y: auto; font-size: 0.9rem; color: #cbd5e1; margin-bottom: 10px; border: 1px solid #334155; }
        .chat-input-group { display: flex; gap: 10px; }
        .chat-input-group input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #fff; }
        .chat-input-group button { padding: 10px 20px; background: var(--primary); border: none; border-radius: 6px; color: #0f172a; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦍 Gorilla AI System</h1>
        <p>Infraestructura inteligente, automatización y alto rendimiento productivo.</p>
        <a href="https://github.com/mglrte1986/gorilla-ai-system" target="_blank" class="btn">Ver Repositorio</a>

        <div class="agent-box">
            <h3>🤖 Agente Héctor (En Línea)</h3>
            <div id="chatOutput" class="chat-output"><strong>Héctor:</strong> Sistema activo. ¿En qué proceso de producción te ayudo hoy?</div>
            <div class="chat-input-group">
                <input type="text" id="userInput" placeholder="Escribe tu comando o consulta..." onkeypress="handleKey(event)">
                <button onclick="sendPrompt()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        function sendPrompt() {
            const input = document.getElementById('userInput');
            const output = document.getElementById('chatOutput');
            const text = input.value.trim();
            
            if(!text) return;

            output.innerHTML += <br><span style="color: #38bdf8;">Tú:</span> ;
            input.value = '';

            setTimeout(() => {
                let response = "Comando procesado correctamente en el entorno base.";
                if(text.toLowerCase().includes('hola')) {
                    response = "¡Hola, Director! Listo para ejecutar tareas de producción y flujos de efectivo.";
                } else if(text.toLowerCase().includes('script')) {
                    response = "Ejecutando validación de scripts en la terminal de shell...";
                }
                output.innerHTML += <br><strong style="color: #22c55e;">Héctor:</strong> ;
                output.scrollTop = output.scrollHeight;
            }, 500);
        }

        function handleKey(e) {
            if(e.key === 'Enter') sendPrompt();
        }
    </script>
</body>
</html>
